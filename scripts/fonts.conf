<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- gen-media 专用 fontconfig：系统字体 + 随仓库安装的 Noto Sans SC（TTF），
     保证 GitHub Actions 等无中文字体的环境也能渲染 OG 图中文标题。
     路径以进程 cwd 为基准（npm scripts 总在包根目录运行）。 -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir prefix="cwd">node_modules/@expo-google-fonts/noto-sans-sc/400Regular</dir>
  <dir prefix="cwd">node_modules/@expo-google-fonts/noto-sans-sc/700Bold</dir>
  <dir prefix="cwd">node_modules/@expo-google-fonts/noto-sans-sc/900Black</dir>
  <cachedir>/tmp/outai-fontconfig-cache</cachedir>
</fontconfig>
