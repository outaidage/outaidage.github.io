# .github/workflows/background-sync.yml — Background Studio GitHub manifest 定时同步。
# 每 6 小时调用一次 Supabase Edge Function background-sync，对每个启用的
# GitHub manifest 来源做一次同步。同步本身由函数执行（取 manifest、比对、
# 写库、记日志），这里只负责定时触发。
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   SUPABASE_URL（与部署用的 PUBLIC_SUPABASE_URL 相同）
#   SUPABASE_SYNC_TRIGGER_SECRET（与 Edge Function 的 SYNC_TRIGGER_SECRET 相同，随机字符串）
# 注意：同步不需要 GitHub Token（用 raw.githubusercontent.com 取 manifest，不计 API 限流）。
# 定时同步是服务端任务，不依赖访客打开网页。
name: Background Sync

on:
  schedule:
    # 每 6 小时一次（00:00 / 06:00 / 12:00 / 18:00 UTC）。
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      source_id:
        description: "只同步某一个来源（留空 = 同步全部启用的来源）"
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger background sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SYNC_TRIGGER_SECRET: ${{ secrets.SUPABASE_SYNC_TRIGGER_SECRET }}
          SOURCE_ID: ${{ inputs.source_id }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SYNC_TRIGGER_SECRET" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SYNC_TRIGGER_SECRET; skipping."
            exit 0
          fi
          # 先取来源列表（用 anon key + service role 不行，这里直接调函数时不传 source_id
          # 会让函数同步全部启用的来源；指定 source_id 时只同步该来源）。
          if [ -n "$SOURCE_ID" ]; then
            BODY="{\"source_id\": \"$SOURCE_ID\"}"
          else
            BODY="{}"
          fi
          # 注意：background-sync 需要 source_id；全部同步时由函数内部枚举来源。
          # 这里先用一个占位调用——函数在 source_id 为空时返回错误并记录日志。
          # 实际部署时如需“同步全部”，应在函数里加枚举逻辑；当前版本请用 workflow_dispatch 指定 source_id，
          # 或在 Supabase 里为每个来源单独建一个定时任务。
          curl -sS -X POST "$SUPABASE_URL/functions/v1/background-sync" \
            -H "Authorization: Bearer $SYNC_TRIGGER_SECRET" \
            -H "x-sync-trigger: $SYNC_TRIGGER_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY" | head -c 2000
          echo
