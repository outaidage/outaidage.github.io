# .github/workflows/background-sync.yml — Background Studio GitHub manifest 定时同步。
# 每 6 小时调用一次 Supabase Edge Function background-sync，对每个启用的
# GitHub manifest 来源做一次同步。同步本身由函数执行（取 manifest、比对、
# 写库、记日志），这里只负责定时触发。
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   SUPABASE_URL（与部署用的 PUBLIC_SUPABASE_URL 相同）
#   SUPABASE_ANON_KEY（Supabase 项目的 anon public key；只用于通过函数网关的 JWT 校验）
#   SUPABASE_SYNC_TRIGGER_SECRET（与 Edge Function 的 SYNC_TRIGGER_SECRET 相同，随机字符串）
# 注意：同步不需要 GitHub Token（用 raw.githubusercontent.com 取 manifest，不计 API 限流）。
# 定时同步是服务端任务，不依赖访客打开网页。
# 认证说明：Supabase 函数网关要求 Authorization 是合法 JWT，所以触发密钥不能直接
# 当 Bearer 用——网关会先以 Invalid JWT 拒绝，函数根本收不到请求。正确做法：
# Authorization Bearer 用 anon key（合法 JWT，仅过网关），真正的触发鉴权走
# x-sync-trigger 头，由函数代码自己比对 SYNC_TRIGGER_SECRET。
name: Background Sync

on:
  schedule:
    # 每 6 小时一次（00:00 / 06:00 / 12:00 / 18:00 UTC）。
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      source_id:
        description: "只同步某一个来源（留空 = 同步全部启用的来源）"
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger background sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SYNC_TRIGGER_SECRET: ${{ secrets.SUPABASE_SYNC_TRIGGER_SECRET }}
          SOURCE_ID: ${{ inputs.source_id }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SYNC_TRIGGER_SECRET" ]; then
            echo "Missing SUPABASE_URL, SUPABASE_ANON_KEY or SUPABASE_SYNC_TRIGGER_SECRET."
            exit 1
          fi
          if [ -n "$SOURCE_ID" ]; then
            BODY="{\"source_id\": \"$SOURCE_ID\"}"
          else
            BODY="{}"
          fi
          # --fail 让 HTTP 非 2xx 直接失败（之前没加，网关 401 也显示绿灯）。
          # 响应体打印出来，方便在日志里确认同步结果。
          RESP=$(curl -sS --fail -X POST "$SUPABASE_URL/functions/v1/background-sync" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "x-sync-trigger: $SYNC_TRIGGER_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true' || { echo "Sync did not return ok:true"; exit 1; }
